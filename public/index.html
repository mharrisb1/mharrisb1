<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mharrisb1.dev</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="/styles/atom-one-dark.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="/scripts/highlight.min.js"></script>
    <script type="module" src="/components/clock.js"></script>
    <script type="module" src="/components/menu.js"></script>
    <script type="module" src="/components/content-window.js"></script>
    <script type="module" src="/components/blog-menu.js"></script>
  </head>
  <body>
    <div class="bg-primary flex">
      <div class="bg-accent px-2 py-1 font-bold">mharrisb1.dev</div>
    </div>
    <div
      id="content"
      class="flex-1 flex justify-center items-center"
      style="min-height: 0"
    >
      <app-menu id="menu" class="w-1/3 border px-12 py-8 space-y-6"> </app-menu>
    </div>
    <div class="bg-primary flex justify-between">
      <div class="px-2 py-1">NOR</div>
      <app-clock id="clock" class="bg-accent px-2 py-1"></app-clock>
    </div>
    <script>
      const contentDiv = document.getElementById("content");

      const renderRoute = () => {
        const hash = window.location.hash.replace(/^#/, "") || "/";
        const [path, queryString] = hash.split("?");
        const params = new URLSearchParams(queryString || "");

        if (path === "/about") {
          document.title = "About | mharrisb1.dev";
          contentDiv.innerHTML = `<content-window class="w-full h-full flex flex-col" style="align-self: stretch;" src="/content/about.html"></content-window>`;
        } else if (path === "/blog") {
          const id = params.get("id");
          if (id) {
            document.title = `${id} | mharrisb1.dev`;
            contentDiv.innerHTML = `<content-window class="w-full h-full flex flex-col" style="align-self: stretch;" src="/content/blog/${id}.html"></content-window>`;
          } else {
            document.title = `Blog | mharrisb1.dev`;
            contentDiv.innerHTML = `<content-window class="w-full h-full flex flex-col" style="align-self: stretch;" src="/content/blog-menu.html"></content-window>`;
          }
        } else {
          document.title = "mharrisb1.dev";
          contentDiv.innerHTML = `<app-menu id="menu" class="w-1/3 border px-12 py-8 space-y-6"></app-menu>`;
        }
      };

      document.addEventListener("navigate", (e) => {
        const path = e.detail.path || "/";
        if (window.location.hash === `#${path}`) {
          renderRoute();
        } else {
          window.location.hash = path;
        }
      });

      document.addEventListener("close-window", () => {
        const hash = window.location.hash.replace(/^#/, "") || "/";
        const [path, queryString] = hash.split("?");
        const params = new URLSearchParams(queryString || "");

        if (path === "/blog" && params.has("id")) {
          window.location.hash = "/blog";
        } else {
          window.location.hash = "/";
        }
      });

      window.addEventListener("hashchange", renderRoute);

      // Initial load
      renderRoute();
    </script>
  </body>
</html>
