<!doctype html>
<html lang="en-US">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>mharrisb1.dev</title>
  <style>
    :root {
      --bg: #1a1b26;
      --bg-highlight: #24283b;
      --fg: #a9b1d6;
      --comment: #565f89;
      --string: #9ece6a;
      --keyword: #bb9af7;
      --line-number: #3b4261;
      --border: #3b4261;
      --accent: #7aa2f7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .editor {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .titlebar {
      background: var(--bg-highlight);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .titlebar-buttons {
      display: flex;
      gap: 8px;
    }

    .titlebar-button {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .titlebar-button.close {
      background: #f7768e;
    }

    .titlebar-button.minimize {
      background: #e0af68;
    }

    .titlebar-button.maximize {
      background: #9ece6a;
    }

    .titlebar-title {
      flex: 1;
      text-align: center;
      color: var(--comment);
      font-size: 13px;
    }

    .content {
      padding: 16px 0;
    }

    .line {
      display: flex;
      padding: 2px 16px;
      cursor: pointer;
      transition: background 0.15s ease;
      position: relative;
    }

    .line:hover {
      background: var(--bg-highlight);
    }

    .line:hover .copy-btn {
      opacity: 1;
    }

    .line-number {
      color: var(--line-number);
      width: 30px;
      text-align: right;
      margin-right: 24px;
      user-select: none;
      flex-shrink: 0;
    }

    .line-content {
      flex: 1;
      white-space: pre;
    }

    .comment {
      color: var(--comment);
    }

    .command {
      color: var(--fg);
    }

    .keyword {
      color: var(--keyword);
    }

    .string {
      color: var(--string);
    }

    .accent {
      color: var(--accent);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .copy-btn {
      opacity: 0;
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
    }

    .copy-btn:hover {
      transform: translateY(-50%) scale(1.05);
    }

    .copy-btn:active {
      transform: translateY(-50%) scale(0.95);
    }

    .copy-btn.copied {
      background: var(--string);
    }

    .empty {
      height: 22px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
        font-size: 12px;
      }

      .line {
        padding: 2px 12px;
      }

      .line-number {
        width: 24px;
        margin-right: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="editor">
    <div class="titlebar">
      <div class="titlebar-buttons">
        <div class="titlebar-button close"></div>
        <div class="titlebar-button minimize"></div>
        <div class="titlebar-button maximize"></div>
      </div>
      <div class="titlebar-title">connect.sh</div>
      <div style="width: 52px;"></div>
    </div>
    <div class="content">
      <div class="line">
        <span class="line-number">1</span>
        <span class="line-content"><span class="comment">#!/bin/bash</span></span>
      </div>
      <div class="line empty">
        <span class="line-number">2</span>
        <span class="line-content"></span>
      </div>
      <div class="line">
        <span class="line-number">3</span>
        <span class="line-content"><span class="comment"># mharrisb1.dev</span></span>
      </div>
      <div class="line">
        <span class="line-number">4</span>
        <span class="line-content"><span class="comment"># My blog you read over SSH</span></span>
      </div>
      <div class="line empty">
        <span class="line-number">5</span>
        <span class="line-content"></span>
      </div>
      <div class="line">
        <span class="line-number">6</span>
        <span class="line-content"><span class="comment"># Connect to read posts:</span></span>
      </div>
      <div class="line" data-copy="ssh mharrisb1.dev">
        <span class="line-number">7</span>
        <span class="line-content"><span class="keyword">ssh</span> <span class="string">mharrisb1.dev</span></span>
        <button class="copy-btn">Copy</button>
      </div>
      <div class="line empty">
        <span class="line-number">8</span>
        <span class="line-content"></span>
      </div>
      <div class="line">
        <span class="line-number">9</span>
        <span class="line-content"><span class="comment"># No account needed. Just connect.</span></span>
      </div>
      <div class="line empty">
        <span class="line-number">11</span>
        <span class="line-content"></span>
      </div>
      <div class="line">
        <span class="line-number">12</span>
        <span class="line-content"><span class="comment"># Source: <span class="accent"><a target="_blank"
                href="https://github.com/mharrisb1/mharrisb1/tree/main/sshd">github.com/mharrisb1/sshd</a></span></span></span>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.line[data-copy]').forEach(line => {
      const btn = line.querySelector('.copy-btn');
      const text = line.dataset.copy;

      line.addEventListener('click', (e) => {
        if (e.target === btn || btn.contains(e.target)) return;
        copyText(text, btn);
      });

      btn.addEventListener('click', () => copyText(text, btn));
    });

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>
</body>

</html>
